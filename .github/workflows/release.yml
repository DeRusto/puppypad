name: Release
# Publishing a release tagged vX.Y.Z builds the app, shots and caddy images, pushes them to
# ghcr.io/<owner>/puppypad-{app,shots,caddy}:vX.Y.Z, and attaches the deploy bundle, install.sh and
# SHA256SUMS to the release. Servers install and upgrade from those with scripts/install.sh.
# It also publishes the CLI in cli/ to npm as @puppypad/cli@X.Y.Z through npm trusted publishing (no token):
# the package's npm settings name this repository and release.yml as its trusted publisher.
on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write
  id-token: write # npm trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check the tag
        run: echo "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+' || { echo "release tags look like v1.2.3, not $TAG"; exit 1; }
        env:
          TAG: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium # for test/editor.browser.test.js
      - run: npm test
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the images
        env:
          TAG: ${{ github.event.release.tag_name }}
          OWNER: ${{ github.repository_owner }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          image="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/puppypad"
          for part in app:. shots:shots caddy:caddy; do
            name=${part%%:*} dir=${part#*:}
            docker build --label "org.opencontainers.image.source=$SOURCE" --label "org.opencontainers.image.version=$TAG" \
              -t "$image-$name:$TAG" "$dir"
            docker push "$image-$name:$TAG"
            # the digest is what servers pull, so pushing the tag again later can't change a release
            echo "$name=$(docker inspect --format '{{index .RepoDigests 0}}' "$image-$name:$TAG")" >> "$RUNNER_TEMP/IMAGES"
          done
      - name: Attach the deploy bundle
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/make-bundle.sh "$TAG" dist "$RUNNER_TEMP/IMAGES"
          gh release upload "$TAG" dist/* --clobber
      - name: Publish the CLI to npm
        env:
          TAG: ${{ github.event.release.tag_name }}
        working-directory: cli
        run: |
          npm version --no-git-tag-version "${TAG#v}"
          npx -y npm@11 publish --access public # trusted publishing needs npm 11.5.1+; Node 22 ships npm 10
